<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Keep learning. Keep building.</title>
  <defs>
    <linearGradient id="footer-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35C5F4"/><stop offset=".5" stop-color="#7771FF"/><stop offset="1" stop-color="#C49BFF"/></linearGradient>
    <linearGradient id="footer-bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#08182B"/><stop offset=".5" stop-color="#171333"/><stop offset="1" stop-color="#24143D"/></linearGradient>
  </defs>
  <rect width="1200" height="112" rx="18" fill="url(#footer-bg)"/>
  <path d="M0 20 C180 65 320 -10 500 30 S850 65 1200 18" fill="none" stroke="url(#footer-line)" stroke-opacity=".65" stroke-width="2" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="-70" dur="12s" repeatCount="indefinite"/></path>
  <text x="600" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E9FF" letter-spacing="2">KEEP LEARNING. KEEP BUILDING.</text>
</svg>
