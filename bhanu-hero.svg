<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bhanu Venkat Sai</title>
  <desc id="desc">Java Full Stack Developer and AI/ML Enthusiast. A midnight-blue and violet technical hero with subtle animated geometry.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset=".55" stop-color="#10102D"/><stop offset="1" stop-color="#21133E"/></linearGradient>
    <linearGradient id="hero-glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35C5F4"/><stop offset=".5" stop-color="#7771FF"/><stop offset="1" stop-color="#C49BFF"/></linearGradient>
    <pattern id="hero-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#A8B8E8" stroke-opacity=".10" stroke-width="1"/></pattern>
    <radialGradient id="hero-orb"><stop offset="0" stop-color="#6958D9" stop-opacity=".30"/><stop offset="1" stop-color="#6958D9" stop-opacity="0"/></radialGradient>
    <filter id="hero-blur"><feGaussianBlur stdDeviation="12"/></filter>
    <mask id="hero-fade"><rect width="1200" height="360" rx="26" fill="url(#hero-bg)"/><circle cx="940" cy="80" r="300" fill="white"/></mask>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#hero-bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#hero-grid)"/>
  <circle cx="960" cy="80" r="260" fill="url(#hero-orb)" filter="url(#hero-blur)"/>
  <g fill="none" stroke="url(#hero-glow)" stroke-width="1.5" opacity=".62">
    <circle cx="990" cy="178" r="112" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0 990 178" to="360 990 178" dur="48s" repeatCount="indefinite"/></circle>
    <ellipse cx="990" cy="178" rx="168" ry="65" transform="rotate(-28 990 178)" stroke-opacity=".45"><animateTransform attributeName="transform" additive="sum" type="rotate" from="0 990 178" to="360 990 178" dur="70s" repeatCount="indefinite"/></ellipse>
    <path d="M760 285 C850 210 875 290 960 205 S1090 95 1160 145" stroke-width="2" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" from="0" to="-80" dur="9s" repeatCount="indefinite"/></path>
  </g>
  <path d="M0 316 C220 300 390 330 590 314 S980 286 1200 306" fill="none" stroke="url(#hero-glow)" stroke-opacity=".28"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="112" fill="#91DDF8" font-size="15" letter-spacing="5">DEVELOPER  /  BUILDER  /  LIFELONG LEARNER</text>
    <text x="74" y="190" fill="#F5F7FF" font-size="58" font-weight="700" letter-spacing="-1.5">Bhanu Venkat Sai</text>
    <text x="78" y="236" fill="#C9C9F5" font-size="24">Java Full Stack Developer <tspan fill="#6CCFF6">|</tspan> AI/ML Enthusiast</text>
    <rect x="78" y="267" width="430" height="3" rx="2" fill="#3B3A66"/>
    <rect x="78" y="267" width="170" height="3" rx="2" fill="url(#hero-glow)"><animate attributeName="width" values="110;360;170" dur="7s" repeatCount="indefinite"/></rect>
    <text x="78" y="303" fill="#AAB7D8" font-size="15" letter-spacing="2">JAVA  ·  SPRING BOOT  ·  REACT  ·  MACHINE LEARNING</text>
  </g>
  <circle cx="990" cy="178" r="5" fill="#B6A5FF"><animate attributeName="r" values="4;8;4" dur="3.5s" repeatCount="indefinite"/></circle>
</svg>
