name: Update GitHub Profile Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub analytics SVGs
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: BHANUVENKATASAI
          cards: overview,contributions,languages
          output-dir: assets
          themes: dark
          commit: true
          commit-message: "Update GitHub analytics"
