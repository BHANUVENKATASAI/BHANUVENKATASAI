<svg width="1200" height="790" viewBox="0 0 1200 790"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="790">
      <stop offset="0%" stop-color="#10070D"/>
      <stop offset="50%" stop-color="#29101B"/>
      <stop offset="100%" stop-color="#160A12"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#401727"/>
      <stop offset="100%" stop-color="#1B0C14"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8F2942"/>
      <stop offset="50%" stop-color="#E7A1B1"/>
      <stop offset="100%" stop-color="#8F2942"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#B83B5B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B83B5B" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="35" height="35"
             patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35"
            stroke="#B85A72" stroke-opacity="0.07" fill="none"/>
    </pattern>

    <filter id="shadow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <style>
      .title {
        font-family: Verdana, sans-serif;
        font-size: 28px;
        font-weight: bold;
        fill: #FFF1F4;
        letter-spacing: 4px;
      }

      .label {
        font-family: Verdana, sans-serif;
        font-size: 15px;
        font-weight: bold;
        fill: #E7A1B1;
        letter-spacing: 1.5px;
      }

      .description {
        font-family: Verdana, sans-serif;
        font-size: 13px;
        fill: #CBAEB7;
      }

      .card {
        fill: url(#card);
        stroke: #8F2942;
        stroke-width: 1.2;
      }

      .number {
        font-family: Verdana, sans-serif;
        font-size: 22px;
        font-weight: bold;
        fill: #FFF1F4;
      }
    </style>
  </defs>

  <!-- BACKGROUND -->

  <rect width="1200" height="790" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="790" rx="24" fill="url(#grid)"/>

  <rect x="2" y="2" width="1196" height="786" rx="22"
        fill="none" stroke="#8F2942" stroke-opacity="0.7"/>

  <circle cx="1050" cy="100" r="160" fill="url(#glow)">
    <animate attributeName="cx"
             values="950;1080;950"
             dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- HEADER -->

  <text x="600" y="65" text-anchor="middle" class="title">
    GITHUB ANALYTICS
  </text>

  <text x="600" y="95" text-anchor="middle" class="description">
    My development activity, repositories and coding journey
  </text>

  <rect x="465" y="112" width="270" height="3" rx="2"
        fill="url(#accent)">
    <animate attributeName="opacity"
             values="0.4;1;0.4"
             dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- LIVE PROFILE STATISTICS -->

  <rect x="45" y="145" width="535" height="205"
        rx="17" class="card"/>

  <text x="75" y="183" class="label">
    01 / PROFILE STATISTICS
  </text>

  <text x="75" y="211" class="description">
    Live GitHub account overview
  </text>

  <rect x="75" y="232" width="475" height="92"
        rx="10" fill="#170B12" stroke="#713047"/>

  <text x="312" y="272" text-anchor="middle"
        class="number" font-size="18">
    GITHUB PROFILE
  </text>

  <text x="312" y="300" text-anchor="middle"
        class="description">
    Repositories • Contributions • Stars • Activity
  </text>

  <!-- LANGUAGE DISTRIBUTION -->

  <rect x="620" y="145" width="535" height="205"
        rx="17" class="card"/>

  <text x="650" y="183" class="label">
    02 / LANGUAGE DISTRIBUTION
  </text>

  <text x="650" y="211" class="description">
    Programming languages used across public repositories
  </text>

  <rect x="650" y="235" width="475" height="88"
        rx="10" fill="#170B12" stroke="#713047"/>

  <text x="887" y="273" text-anchor="middle"
        class="number" font-size="18">
    TOP LANGUAGES
  </text>

  <text x="887" y="300" text-anchor="middle"
        class="description">
    Java • Python • JavaScript • Other
  </text>

  <!-- CONTRIBUTION STREAK -->

  <rect x="45" y="375" width="1110" height="150"
        rx="17" class="card"/>

  <text x="75" y="414" class="label">
    03 / CONTRIBUTION STREAK
  </text>

  <text x="75" y="444" class="description">
    Consistency, coding activity and contribution history
  </text>

  <rect x="75" y="465" width="1050" height="38"
        rx="8" fill="#170B12" stroke="#713047"/>

  <text x="600" y="489" text-anchor="middle"
        font-family="Verdana" font-size="13"
        fill="#E7A1B1">
    KEEP BUILDING • KEEP LEARNING • KEEP CONTRIBUTING
  </text>

  <!-- CONTRIBUTION GRAPH -->

  <rect x="45" y="550" width="1110" height="145"
        rx="17" class="card"/>

  <text x="75" y="590" class="label">
    04 / CONTRIBUTION ACTIVITY
  </text>

  <text x="75" y="617" class="description">
    Explore the real GitHub contribution calendar below
  </text>

  <g transform="translate(75,640)">
    <rect x="0" y="0" width="17" height="17" rx="3" fill="#351522"/>
    <rect x="27" y="0" width="17" height="17" rx="3" fill="#713047"/>
    <rect x="54" y="0" width="17" height="17" rx="3" fill="#9D3C59"/>
    <rect x="81" y="0" width="17" height="17" rx="3" fill="#C85C78"/>
    <rect x="108" y="0" width="17" height="17" rx="3" fill="#E7A1B1"/>

    <text x="145" y="14" class="description">
      Contribution intensity legend
    </text>
  </g>

  <!-- CODING JOURNEY -->

  <rect x="45" y="720" width="1110" height="45"
        rx="12" fill="#351522" stroke="#8F2942"/>

  <text x="600" y="749" text-anchor="middle"
        font-family="Verdana" font-size="14"
        font-weight="bold" fill="#FFF1F4"
        letter-spacing="2">
    LEARN  →  BUILD  →  CONTRIBUTE  →  GROW
  </text>

  <rect x="45" y="782" width="1110" height="2"
        rx="1" fill="url(#accent)">
    <animate attributeName="opacity"
             values="0.3;1;0.3"
             dur="4s" repeatCount="indefinite"/>
  </rect>

</svg>
