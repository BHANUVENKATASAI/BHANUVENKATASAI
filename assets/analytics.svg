<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="190"
     viewBox="0 0 1200 190">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070D"/>
      <stop offset="50%" stop-color="#29101B"/>
      <stop offset="100%" stop-color="#160A12"/>
    </linearGradient>

    <linearGradient id="burgundy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64243D"/>
      <stop offset="50%" stop-color="#CF6C85"/>
      <stop offset="100%" stop-color="#E7A1B1"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#CF6C85" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#CF6C85" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="35" height="35"
             patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35"
            fill="none"
            stroke="#CF6C85"
            stroke-opacity=".09"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="190" rx="20"
        fill="url(#background)"/>

  <rect width="1200" height="190" rx="20"
        fill="url(#grid)"/>

  <!-- BORDER -->
  <rect x="2" y="2" width="1196" height="186"
        rx="18" fill="none"
        stroke="#8F2942"
        stroke-opacity=".7"/>

  <!-- GLOW -->
  <circle cx="1030" cy="80" r="150"
          fill="url(#glow)">
    <animate attributeName="cx"
             values="980;1080;980"
             dur="8s"
             repeatCount="indefinite"/>
  </circle>

  <!-- DECORATIVE GRAPH -->
  <path d="M720 135
           C780 105 820 125 870 85
           S960 55 1010 95
           S1100 125 1170 55"
        fill="none"
        stroke="#CF6C85"
        stroke-width="2"
        stroke-opacity=".65"
        stroke-dasharray="7 9">

    <animate attributeName="stroke-dashoffset"
             from="0" to="-100"
             dur="7s"
             repeatCount="indefinite"/>
  </path>

  <!-- GRAPH NODES -->
  <circle cx="870" cy="85" r="4"
          fill="#E7A1B1">
    <animate attributeName="r"
             values="3;7;3"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1010" cy="95" r="4"
          fill="#E7A1B1">
    <animate attributeName="r"
             values="3;7;3"
             dur="2.5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1170" cy="55" r="4"
          fill="#E7A1B1"/>

  <!-- SMALL LABEL -->
  <text x="75" y="55"
        fill="#CF6C85"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="5">
    PROFILE PERFORMANCE
  </text>

  <!-- MAIN TITLE -->
  <text x="72" y="112"
        fill="#F5E8EC"
        font-family="Arial, sans-serif"
        font-size="42"
        font-weight="bold"
        letter-spacing="3">
    GITHUB ANALYTICS
  </text>

  <!-- UNDERLINE -->
  <rect x="75" y="130"
        width="230" height="3"
        rx="2"
        fill="url(#burgundy)">

    <animate attributeName="width"
             values="100;280;230"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <!-- SUBTITLE -->
  <text x="75" y="160"
        fill="#BFAAB1"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="2">
    CODE • CONTRIBUTE • LEARN • GROW
  </text>

</svg>
