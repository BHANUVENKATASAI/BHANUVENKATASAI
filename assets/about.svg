<svg width="1200" height="600" viewBox="0 0 1200 600"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600">
    <stop stop-color="#10070D"/>
    <stop offset="0.5" stop-color="#29101B"/>
    <stop offset="1" stop-color="#160A12"/>
  </linearGradient>

  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#351522"/>
    <stop offset="1" stop-color="#1B0C14"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#8F2942"/>
    <stop offset="0.5" stop-color="#E7A1B1"/>
    <stop offset="1" stop-color="#8F2942"/>
  </linearGradient>

  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
    <path d="M35 0H0V35" stroke="#B85A72" stroke-opacity="0.08"/>
  </pattern>
</defs>

<rect width="1200" height="600" rx="22" fill="url(#bg)"/>
<rect width="1200" height="600" rx="22" fill="url(#grid)"/>

<rect x="2" y="2" width="1196" height="596" rx="20"
stroke="#8F2942" stroke-opacity="0.65"/>

<text x="600" y="65" text-anchor="middle"
font-family="Verdana" font-size="29" font-weight="bold"
fill="#FCEBF0" letter-spacing="4">
ABOUT ME
</text>

<rect x="500" y="82" width="200" height="3" rx="2" fill="url(#line)">
