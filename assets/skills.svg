<svg width="1200" height="850" viewBox="0 0 1200 850"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="850">
      <stop offset="0%" stop-color="#10070D"/>
      <stop offset="50%" stop-color="#29101B"/>
      <stop offset="100%" stop-color="#160A12"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#401727"/>
      <stop offset="100%" stop-color="#1B0C14"/>
    </linearGradient>

    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8F2942"/>
      <stop offset="50%" stop-color="#E7A1B1"/>
      <stop offset="100%" stop-color="#8F2942"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="35" height="35"
             patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35"
            stroke="#B85A72" stroke-opacity="0.08" fill="none"/>
    </pattern>

    <style>
      .heading {
        font-family: Verdana, sans-serif;
        font-size: 28px;
        font-weight: bold;
        fill: #FFF1F4;
        letter-spacing: 4px;
      }

      .category {
        font-family: Verdana, sans-serif;
        font-size: 16px;
        font-weight: bold;
        fill: #E7A1B1;
        letter-spacing: 1.5px;
      }

      .skill {
        font-family: Verdana, sans-serif;
        font-size: 15px;
        font-weight: bold;
        fill: #FCEBF0;
      }

      .subtext {
        font-family: Verdana, sans-serif;
        font-size: 12px;
        fill: #CBAEB7;
      }

      .badge {
        fill: #552033;
        stroke: #A94B65;
        stroke-width: 1;
      }

      .card {
        fill: url(#card);
        stroke: #8F2942;
        stroke-width: 1.2;
      }
    </style>
  </defs>

  <!-- BACKGROUND -->

  <rect width="1200" height="850" rx="24" fill="url(#background)"/>
  <rect width="1200" height="850" rx="24" fill="url(#grid)"/>

  <rect x="2" y="2" width="1196" height="846" rx="22"
        fill="none" stroke="#8F2942" stroke-opacity="0.7"/>

  <!-- HEADER -->

  <text x="600" y="65" text-anchor="middle" class="heading">
    TECHNICAL ARSENAL
  </text>

  <text x="600" y="95" text-anchor="middle" class="subtext"
        font-size="13">
    Technologies I use to design, develop and build intelligent solutions
  </text>

  <rect x="470" y="112" width="260" height="3" rx="2"
        fill="url(#highlight)">
    <animate attributeName="opacity"
             values="0.4;1;0.4"
             dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- PROGRAMMING LANGUAGES -->

  <rect x="45" y="145" width="535" height="175" rx="17" class="card"/>

  <rect x="45" y="145" width="5" height="175" rx="2"
        fill="#E7A1B1" filter="url(#glow)"/>

  <text x="75" y="180" class="category">
    01 / PROGRAMMING LANGUAGES
  </text>

  <text x="75" y="207" class="subtext">
    Core languages for problem solving and application development
  </text>

  <rect x="75" y="228" width="105" height="36" rx="8" class="badge"/>
  <text x="127" y="251" text-anchor="middle" class="skill">JAVA</text>

  <rect x="192" y="228" width="105" height="36" rx="8" class="badge"/>
  <text x="244" y="251" text-anchor="middle" class="skill">PYTHON</text>

  <rect x="309" y="228" width="125" height="36" rx="8" class="badge"/>
  <text x="371" y="251" text-anchor="middle" class="skill">JAVASCRIPT</text>

  <rect x="75" y="273" width="85" height="30" rx="7" class="badge"/>
  <text x="117" y="293" text-anchor="middle" class="skill">SQL</text>

  <rect x="171" y="273" width="105" height="30" rx="7" class="badge"/>
  <text x="223" y="293" text-anchor="middle" class="skill">HTML</text>

  <rect x="287" y="273" width="105" height="30" rx="7" class="badge"/>
  <text x="339" y="293" text-anchor="middle" class="skill">CSS</text>

  <!-- FULL STACK -->

  <rect x="620" y="145" width="535" height="175" rx="17" class="card"/>

  <rect x="620" y="145" width="5" height="175" rx="2"
        fill="#E7A1B1" filter="url(#glow)"/>

  <text x="650" y="180" class="category">
    02 / FULL STACK DEVELOPMENT
  </text>

  <text x="650" y="207" class="subtext">
    Frontend, backend and API development
  </text>

  <rect x="650" y="228" width="135" height="36" rx="8" class="badge"/>
  <text x="717" y="251" text-anchor="middle" class="skill">SPRING BOOT</text>

  <rect x="797" y="228" width="110" height="36" rx="8" class="badge"/>
  <text x="852" y="251" text-anchor="middle" class="skill">REACT.JS</text>

  <rect x="919" y="228" width="115" height="36" rx="8" class="badge"/>
  <text x="976" y="251" text-anchor="middle" class="skill">FASTAPI</text>

  <rect x="650" y="273" width="95" height="30" rx="7" class="badge"/>
  <text x="697" y="293" text-anchor="middle" class="skill">FLASK</text>

  <rect x="756" y="273" width="135" height="30" rx="7" class="badge"/>
  <text x="823" y="293" text-anchor="middle" class="skill">REST APIs</text>

  <rect x="902" y="273" width="135" height="30" rx="7" class="badge"/>
  <text x="969" y="293" text-anchor="middle" class="skill">STREAMLIT</text>

  <!-- AI & MACHINE LEARNING -->

  <rect x="45" y="345" width="535" height="205" rx="17" class="card"/>

  <rect x="45" y="345" width="5" height="205" rx="2"
        fill="#E7A1B1" filter="url(#glow)"/>

  <text x="75" y="380" class="category">
    03 / AI &amp; MACHINE LEARNING
  </text>

  <text x="75" y="407" class="subtext">
    Data analysis, predictive modelling and intelligent applications
  </text>

  <rect x="75" y="430" width="105" height="36" rx="8" class="badge"/>
  <text x="127" y="453" text-anchor="middle" class="skill">PANDAS</text>

  <rect x="192" y="430" width="105" height="36" rx="8" class="badge"/>
  <text x="244" y="453" text-anchor="middle" class="skill">NUMPY</text>

  <rect x="309" y="430" width="140" height="36" rx="8" class="badge"/>
  <text x="379" y="453" text-anchor="middle" class="skill">SCIKIT-LEARN</text>

  <rect x="75" y="475" width="120" height="36" rx="8" class="badge"/>
  <text x="135" y="498" text-anchor="middle" class="skill">PYTORCH</text>

  <rect x="207" y="475" width="130" height="36" rx="8" class="badge"/>
  <text x="272" y="498" text-anchor="middle" class="skill">TENSORFLOW</text>

  <rect x="349" y="475" width="105" height="36" rx="8" class="badge"/>
  <text x="401" y="498" text-anchor="middle" class="skill">OPENCV</text>

  <text x="75" y="530" class="subtext">
    Generative AI • YOLOv8 • Whisper • Matplotlib
  </text>

  <!-- DATABASES -->

  <rect x="620" y="345" width="535" height="205" rx="17" class="card"/>

  <rect x="620" y="345" width="5" height="205" rx="2"
        fill="#E7A1B1" filter="url(#glow)"/>

  <text x="650" y="380" class="category">
    04 / DATABASE MANAGEMENT
  </text>

  <text x="650" y="407" class="subtext">
    Relational database technologies and data management
  </text>

  <rect x="650" y="445" width="145" height="48" rx="9" class="badge"/>
  <text x="722" y="475" text-anchor="middle" class="skill">MYSQL</text>

  <rect x="810" y="445" width="165" height="48" rx="9" class="badge"/>
  <text x="892" y="475" text-anchor="middle" class="skill">POSTGRESQL</text>

  <text x="650" y="525" class="subtext">
    SQL • Database Design • Relational Databases
  </text>

  <!-- TOOLS -->

  <rect x="45" y="575" width="535" height="175" rx="17" class="card"/>

  <rect x="45" y="575" width="5" height="175" rx="2"
        fill="#E7A1B1" filter="url(#glow)"/>

  <text x="75" y="610" class="category">
    05 / TOOLS &amp; PLATFORMS
  </text>

  <text x="75" y="637" class="subtext">
    Development tools, version control and deployment
  </text>

  <rect x="75" y="660" width="100" height="35" rx="8" class="badge"/>
  <text x="125" y="683" text-anchor="middle" class="skill">GIT</text>

  <rect x="187" y="660" width="115" height="35" rx="8" class="badge"/>
  <text x="244" y="683" text-anchor="middle" class="skill">GITHUB</text>

  <rect x="314" y="660" width="120" height="35" rx="8" class="badge"/>
  <text x="374" y="683" text-anchor="middle" class="skill">DOCKER</text>

  <text x="75" y="725" class="subtext">
    VS Code • SonarQube • Power BI
  </text>

  <!-- COMPUTER SCIENCE -->

  <rect x="620" y="575" width="535" height="175" rx="17" class="card"/>

  <rect x="620" y="575" width="5" height="175" rx="2"
        fill="#E7A1B1" filter="url(#glow)"/>

  <text x="650" y="610" class="category">
    06 / COMPUTER SCIENCE
  </text>

  <text x="650" y="637" class="subtext">
    Core concepts for software engineering and technical interviews
  </text>

  <rect x="650" y="660" width="230" height="35" rx="8" class="badge"/>
  <text x="775" y="693" text-anchor="middle" class="skill">DATA STRUCTURES &amp; ALGORITHMS</text>

  <rect x="892" y="660" width="85" height="35" rx="8" class="badge"/>
  <text x="934" y="683" text-anchor="middle" class="skill">OOP</text>

  <text x="650" y="725" class="subtext">
    DBMS • Operating Systems • Computer Networks
  </text>

  <!-- BOTTOM ACCENT -->

  <rect x="45" y="790" width="1110" height="2" rx="1"
        fill="url(#highlight)">
    <animate attributeName="opacity"
             values="0.3;1;0.3"
             dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="825" text-anchor="middle"
        font-family="Verdana" font-size="12"
        fill="#B88C99" letter-spacing="3">
    CONTINUOUSLY LEARNING • BUILDING • IMPROVING
  </text>

</svg>
