<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="160" viewBox="0 0 1200 160">

<defs>
  <linearGradient id="bg">
    <stop stop-color="#10090D"/>
    <stop offset=".5" stop-color="#28101B"/>
    <stop offset="1" stop-color="#4A182B"/>
  </linearGradient>

  <linearGradient id="rose">
    <stop stop-color="#64243D"/>
    <stop offset=".5" stop-color="#A64D69"/>
    <stop offset="1" stop-color="#E7A0B4"/>
  </linearGradient>
</defs>

<rect width="1200" height="160" rx="18" fill="url(#bg)"/>

<path d="M0 30 Q300 130 600 40 T1200 80"
      stroke="url(#rose)" stroke-width="3"
      fill="none" stroke-dasharray="8 10">
  <animate attributeName="stroke-dashoffset"
           from="0" to="-100" dur="6s"
           repeatCount="indefinite"/>
</path>

<circle cx="200" cy="80" r="5" fill="#E7A0B4">
  <animate attributeName="cy"
           values="70;95;70" dur="3s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1000" cy="90" r="5" fill="#E7A0B4">
  <animate attributeName="cy"
           values="90;65;90" dur="3s"
           repeatCount="indefinite"/>
</circle>

<text x="600" y="82" text-anchor="middle"
      fill="#F8EDEF" font-family="Arial"
      font-size="25" font-weight="bold"
      letter-spacing="3">
  THANK YOU FOR VISITING
</text>

<text x="600" y="115" text-anchor="middle"
      fill="#E7A0B4" font-family="Arial"
      font-size="14" letter-spacing="4">
  KEEP BUILDING • KEEP EXPLORING • KEEP GROWING
</text>

</svg>
