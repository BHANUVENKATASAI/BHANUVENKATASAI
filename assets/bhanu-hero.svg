<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="330"
     viewBox="0 0 1200 330">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#10090D"/>
    <stop offset="55%" stop-color="#28101B"/>
    <stop offset="100%" stop-color="#4A182B"/>
  </linearGradient>

  <linearGradient id="wine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#64243D"/>
    <stop offset="50%" stop-color="#A64D69"/>
    <stop offset="100%" stop-color="#E5A1B3"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#E7A0B4" stop-opacity=".32"/>
    <stop offset="100%" stop-color="#E7A0B4" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="36" height="36"
           patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36"
          fill="none"
          stroke="#D98BA3"
          stroke-opacity=".10"
          stroke-width="1"/>
  </pattern>

  <filter id="blur">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A64D69" stop-opacity="0"/>
    <stop offset="50%" stop-color="#F3C4D0" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#A64D69" stop-opacity="0"/>
  </linearGradient>

</defs>

<!-- Background -->
<rect width="1200" height="330" rx="20" fill="url(#bg)"/>

<!-- Technical grid -->
<rect width="1200" height="330" rx="20" fill="url(#grid)"/>

<!-- Atmospheric glow -->
<circle cx="950" cy="130" r="220"
        fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="cx"
           values="900;1040;900"
           dur="9s" repeatCount="indefinite"/>
</circle>

<!-- Moving light -->
<rect x="-300" y="0" width="220" height="330"
      fill="url(#light)" opacity=".35"
      transform="skewX(-20)">
  <animate attributeName="x"
           values="-300;1400"
           dur="8s"
           repeatCount="indefinite"/>
</rect>

<!-- Animated technical path -->
<path d="M650 270 C760 180 830 280 930 180
         S1080 100 1200 155"
      fill="none"
      stroke="#C66B88"
      stroke-opacity=".65"
      stroke-width="2"
      stroke-dasharray="8 10">
  <animate attributeName="stroke-dashoffset"
           from="0" to="-100"
           dur="5s"
           repeatCount="indefinite"/>
</path>

<!-- Decorative nodes -->
<circle cx="930" cy="180" r="5" fill="#E7A0B4">
  <animate attributeName="r"
           values="4;8;4"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="120" r="4" fill="#E7A0B4"/>

<!-- Header -->
<text x="75" y="75"
      fill="#D99AAE"
      font-family="Arial, sans-serif"
      font-size="16"
      letter-spacing="5">
  SOFTWARE ENGINEERING • ARTIFICIAL INTELLIGENCE
</text>

<!-- Name -->
<text x="72" y="155"
      fill="#F8EDEF"
      font-family="Arial, sans-serif"
      font-size="55"
      font-weight="bold">
  BHANU VENKAT SAI
</text>

<!-- Accent underline -->
<rect x="76" y="177" width="230" height="3"
      rx="2" fill="url(#wine)">
  <animate attributeName="width"
           values="100;280;230"
           dur="4s"
           repeatCount="indefinite"/>
</rect>

<!-- Role -->
<text x="76" y="220"
      fill="#E7A0B4"
      font-family="Arial, sans-serif"
      font-size="23">
  Java Full Stack Developer | AI/ML Enthusiast
</text>

<text x="76" y="260"
      fill="#D9C3CA"
      font-family="Arial, sans-serif"
      font-size="16"
      letter-spacing="2">
  BUILDING SYSTEMS • SOLVING PROBLEMS • LEARNING
</text>

<!-- Right-side technical label -->
<rect x="895" y="210" width="220" height="62"
      rx="10"
      fill="#1A0C13"
      stroke="#A64D69"
      stroke-opacity=".7"/>

<text x="1005" y="235"
      text-anchor="middle"
      fill="#D99AAE"
      font-family="Arial, sans-serif"
      font-size="12"
      letter-spacing="2">
  CURRENT FOCUS
</text>

<text x="1005" y="257"
      text-anchor="middle"
      fill="#F8EDEF"
      font-family="Arial, sans-serif"
      font-size="18"
      font-weight="bold">
  JAVA + AI/ML
</text>

</svg>
